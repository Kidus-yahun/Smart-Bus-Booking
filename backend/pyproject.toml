[project]
name = "smartbus-backend"
version = "1.0.0"
description = "Smart Bus Booking System Backend for Ethiopia"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "sqlalchemy>=2.0.36",
    "python-multipart>=0.0.20",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "python-dotenv>=1.0.0",
    "pydantic[email]>=2.10.0",
    "alembic>=1.14.0",
    "qrcode[pil]>=7.4.2",
    "stripe>=7.7.0",
    "httpx>=0.25.2",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary==2.9.9"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
