version: '3.8'

services:
  api:
    build: .
    ports:
      - "7077:7077"
    environment:
      - DATABASE_URL=/data/smartbus.db
      - SECRET_KEY=your-super-secret-key-change-this-in-production
      - DEBUG=True
      - PORT=7077
    volumes:
      - ../db:/data
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 7077

networks:
  default:
    name: smartbus_network